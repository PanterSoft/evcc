template: iaqualink
group: heating
products:
  - brand: Zodiac
    description:
      generic: Z550iQ / ZS500 (iAqualink)
requirements:
  description:
    de: |
      Zodiac Poolwärmepumpe der zs500-Familie über die iAqualink-Cloud.

      Die Betriebsart wird aus dem verfügbaren Überschuss gewählt: wenig Überschuss →
      Eco (langsam und leise), mittlerer → Smart (optimaler Betriebspunkt), viel → Boost
      (so schnell wie möglich). Die Grenzen sind über ecopower/boostpower einstellbar.

      Im Modus „Aus" wird das Gerät abgeschaltet, sonst eingeschaltet und in der
      passenden Betriebsart betrieben. Bei zu wenig Überschuss wird nur die Betriebsart
      reduziert und nicht abgeschaltet, da häufiges Schalten den Kompressor belastet.

      Das Gerät meldet keine Leistungsaufnahme. Für die Verbrauchsmessung ist ein separater Zähler nötig.
    en: |
      Zodiac zs500-family pool heat pump via the iAqualink cloud.

      The operating mode follows the available surplus: little surplus → eco (slow and
      quiet), medium → smart (best operating point), plenty → boost (as fast as possible).
      The thresholds are configurable via ecopower/boostpower.

      In "off" mode the device is switched off, otherwise it is switched on and run in
      the appropriate operating mode. Insufficient surplus only lowers the operating
      mode rather than switching off, as frequent cycling stresses the compressor.

      The device does not report power consumption. Use a separate meter to measure it.
params:
  - name: user
    required: true
    description:
      generic: iAqualink E-Mail
    help:
      de: Anmelde-E-Mail der iAqualink-App
      en: Login email of the iAqualink app
  - name: password
    required: true
  - name: device
    description:
      de: Seriennummer
      en: Serial number
    help:
      de: Nur erforderlich, wenn das Konto mehr als eine Wärmepumpe enthält. Bei leerem Feld nennt die Fehlermeldung die verfügbaren Seriennummern.
      en: Only required if the account contains more than one heat pump. Leave empty to have the error message list the available serial numbers.
  - name: ecopower
    advanced: true
    type: int
    unit: W
    default: 1000
    description:
      de: Grenze Eco-Modus
      en: Eco mode threshold
    help:
      de: Unterhalb dieser Leistung heizt das Gerät im Eco-Modus (langsam und leise).
      en: Below this power the device heats in eco mode (slow and quiet).
  - name: boostpower
    advanced: true
    type: int
    unit: W
    default: 2000
    description:
      de: Grenze Boost-Modus
      en: Boost mode threshold
    help:
      de: Ab dieser Leistung heizt das Gerät im Boost-Modus, dazwischen im Smart-Modus.
      en: From this power the device heats in boost mode, in between in smart mode.
  - name: cache
    advanced: true
    default: 30s
    help:
      de: Die iAqualink-Cloud begrenzt die Abfragerate auf etwa eine Anfrage pro 10 Sekunden
      en: The iAqualink cloud rate-limits to roughly one request per 10 seconds
render: |
  type: iaqualink
  user: {{ .user }}
  password: {{ .password }}
  {{- if .device }}
  device: {{ .device }}
  {{- end }}
  ecopower: {{ .ecopower }}
  boostpower: {{ .boostpower }}
  cache: {{ .cache }}
