template: iaqualink
group: heating
products:
  - brand: Zodiac
    description:
      generic: Z550iQ / ZS500 (iAqualink)
requirements:
  description:
    de: |
      Zodiac Poolwärmepumpe der zs500-Familie über die iAqualink-Cloud.

      Die evcc SG-Ready-Modi werden auf die Betriebsart der Wärmepumpe abgebildet:
      Boost (3) → Boost, Normal (2) → Smart, Dimmen (1) → Eco.

      evcc steuert ausschließlich die Betriebsart und schaltet das Gerät nicht ein oder aus.
      Die Wärmepumpe muss daher in der iAqualink-App eingeschaltet sein.
      Das Gerät meldet keine Leistungsaufnahme. Für die Verbrauchsmessung ist ein separater Zähler nötig.
    en: |
      Zodiac zs500-family pool heat pump via the iAqualink cloud.

      The evcc SG Ready modes map to the heat pump operating mode:
      boost (3) → boost, normal (2) → smart, dim (1) → eco.

      evcc only controls the operating mode and never switches the device on or off,
      so the heat pump must be switched on in the iAqualink app.
      The device does not report power consumption. Use a separate meter to measure it.
params:
  - name: user
    required: true
    description:
      generic: iAqualink E-Mail
    help:
      de: Anmelde-E-Mail der iAqualink-App
      en: Login email of the iAqualink app
  - name: password
    required: true
  - name: device
    description:
      de: Seriennummer
      en: Serial number
    help:
      de: Nur erforderlich, wenn das Konto mehr als eine Wärmepumpe enthält
      en: Only required if the account contains more than one heat pump
    service: iaqualink/devices?user={user}&password={password}
  - name: cache
    advanced: true
    default: 30s
    help:
      de: Die iAqualink-Cloud begrenzt die Abfragerate auf etwa eine Anfrage pro 10 Sekunden
      en: The iAqualink cloud rate-limits to roughly one request per 10 seconds
render: |
  type: iaqualink
  user: {{ .user }}
  password: {{ .password }}
  {{- if .device }}
  device: {{ .device }}
  {{- end }}
  cache: {{ .cache }}
